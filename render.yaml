# ============================================================
# BZFBDZ-node — Render Blueprint
# المسارات: /webhook (فيسبوك)، /tg/webhook (تلغرام)، /ig/webhook (انستغرام)
#
# ⚠️ كل الأسرار هنا `sync: false` = تُضبط من لوحة Render فقط ولا تُرفع للمستودع.
#    سبب التغيير: كانت أسرار Djezzy مكتوبة هنا نصّياً، ونسخة منها في تاريخ Git.
#
# ⚠️ لا ينشئ هذا الملف قاعدة بيانات، ولا يدير ربطها.
#    الإنتاج يستخدم قاعدة bzfbdz_node الموجودة مسبقاً، وربطها يدوي.
#
#    سبب هذا القيد: وجود كتلة databases هنا كان يجعل Render ينشئ/يربط قاعدة
#    جديدة (bzfbdz) في كل مزامنة للـ blueprint، فتضيع DATABASE_URL ويهبط
#    الخادم على SQLite مؤقت — ويمسح كل المستخدمين والجلسات.
#    التحقق من سلامة القاعدة: /health يجب أن يُرجع
#      "db":"pg" و "hasDatabaseUrl":true
#    إن رأيت "db":"sqlite" فـ DATABASE_URL مفقود من Environment.
# ============================================================
services:
  - type: web
    name: bzfbdz-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0

      # ---------- الاتصال بالقاعدة (إلزامي) ----------
      # سلسلة الاتصال الداخلية لقاعدة bzfbdz_node الحالية.
      # ⚠️ كلمة المرور هنا كانت مسرّبة في تاريخ Git عبر seed_proxies.cjs
      #    => يجب تدويرها في Render قبل الإنتاج، ثم وضع القيمة الجديدة هنا.
      - key: DATABASE_URL
        sync: false

      # ---------- رموز الوصول (إلزامية) ----------
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: PAGE_APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: IG_PAGE_ACCESS_TOKEN
        sync: false
      - key: IG_PAGE_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: DIAG_KEY
        sync: false

      # ---------- دجيزي ----------
      - key: DJEZZY_CLIENT_ID
        sync: false
      - key: DJEZZY_CLIENT_SECRET
        sync: false
      - key: DJEZZY_CLIENT_ID_V2
        sync: false
      - key: DJEZZY_CLIENT_SECRET_V2
        sync: false
      - key: API_BASE_URL_DJEZZY
        value: https://apim.djezzy.dz

      # ---------- أوريدو ----------
      - key: OOREDOO_CLIENT_ID
        sync: false
      - key: API_BASE_URL_OOREDOO
        value: https://apis.ooredoo.dz
      - key: X_SIGNATURE
        value: 634efc7e419e3f5797ec445e29176c525cee4bfc17de0a8f4c399da5a3628ac1
      - key: OOREDOO_INSTANCE_ID
        value: 7f1d9e3c5a6b8f2e4d1c9a7b3e5f8d2c
      - key: OOREDOO_MODERN_PLANS
        value: "N'YOOZ,DIMA,682,654,736"
      - key: OOREDOO_SNAPCHAT_PLANS
        value: "N'YOOZ,682,736"
      - key: OOREDOO_BYOP_PLANS
        value: "N'YOOZ,682,736"
      - key: OOREDOO_GIFT_COOLDOWN_HOURS
        value: "24"

      # ---------- الريلايس (مسار أوريدو المعتمد: يخرج من Cloudflare وغير محجوب) ----------
      # ⚠️ Render من إionesي/أمريكا: طلبات أوريدو المباشرة محجوبة جغرافياً.
      #    لذلك مسار أوريدو كله يمر عبر الريلايس. لا تُفرغ هذه القيم.
      - key: OOREDOO_RELAY_URL
        value: https://oo-relay.asslibachiir.workers.dev
      - key: OOREDOO_RELAY_URL_LIST
        # 45 ريلاي. ملاحظة مهمة: Render لا يطبّق هذه المتغيّرات على خدمة قائمة،
        # لذلك القائمة المدمجة في src/config/relays.js هي التي تُفعّلها فعلياً.
        # هذه القيمة للخدمات الجديدة فقط / للتوثيق. التدوير بالترجيح في
        # src/services/http.js هو ما يقرّر الترتيب بعد تعلّم الفشل.
        value: "https://oo-relay-16.asslibachiir.workers.dev,https://oo-relay-17.asslibachiir.workers.dev,https://oo-relay-18.asslibachiir.workers.dev,https://oo-relay-19.asslibachiir.workers.dev,https://oo-relay-20.asslibachiir.workers.dev,https://oo-relay-21.asslibachiir.workers.dev,https://oo-relay-22.asslibachiir.workers.dev,https://oo-relay-23.asslibachiir.workers.dev,https://oo-relay-24.asslibachiir.workers.dev,https://oo-relay-25.asslibachiir.workers.dev,https://oo-relay-26.asslibachiir.workers.dev,https://oo-relay-27.asslibachiir.workers.dev,https://oo-relay-28.asslibachiir.workers.dev,https://oo-relay-29.asslibachiir.workers.dev,https://oo-relay-30.asslibachiir.workers.dev,https://oo-relay-31.asslibachiir.workers.dev,https://oo-relay-32.asslibachiir.workers.dev,https://oo-relay-33.asslibachiir.workers.dev,https://oo-relay-34.asslibachiir.workers.dev,https://oo-relay-35.asslibachiir.workers.dev,https://oo-relay-36.asslibachiir.workers.dev,https://oo-relay-37.asslibachiir.workers.dev,https://oo-relay-38.asslibachiir.workers.dev,https://oo-relay-39.asslibachiir.workers.dev,https://oo-relay-40.asslibachiir.workers.dev,https://oo-relay-41.asslibachiir.workers.dev,https://oo-relay-6.asslibachiir.workers.dev,https://oo-relay-7.asslibachiir.workers.dev,https://oo-relay-8.asslibachiir.workers.dev,https://oo-relay-9.asslibachiir.workers.dev,https://oo-relay-10.asslibachiir.workers.dev,https://oo-relay-11.asslibachiir.workers.dev,https://oo-relay-12.asslibachiir.workers.dev,https://oo-relay-13.asslibachiir.workers.dev,https://oo-relay-14.asslibachiir.workers.dev,https://oo-relay-15.asslibachiir.workers.dev,https://oo-relay-2.asslibachiir.workers.dev,https://oo-relay-3.asslibachiir.workers.dev,https://oo-relay-4.asslibachiir.workers.dev,https://oo-relay-5.asslibachiir.workers.dev,https://oo-relay-42.asslibachiir.workers.dev,https://oo-relay-43.asslibachiir.workers.dev,https://oo-relay.asslibachiir.workers.dev,https://oo-relay-alt.asslimstph.workers.dev,https://oo-relay-alt-2.asslimstph.workers.dev"
      # فارغ = دجيزي بلا ريلاي (يعتمد على جدول proxies). فعّله لاحقاً إن نُشر ريلاي له.
      - key: DJEZZY_RELAY_URL
        value: ""
      - key: RELAY_SECRET
        sync: false
      # يجب أن يكون false أو فارغاً. انتبه: "false" كنص كان يُفعّل الإجبار في الكود.
      - key: OOREDOO_FORCE_DBPROXY
        value: "false"

      # ---------- ضغط الحمل ----------
      - key: LOAD_MAX_CONCURRENCY
        value: "8"
      - key: LOAD_QUEUE_TTL_MS
        value: "12000"
